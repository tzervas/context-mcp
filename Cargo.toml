[package]
name = "context-mcp"
version = "0.4.0"
edition = "2021"
# Verified floor (build + `cargo test`), not aspirational: rayon 1.11 requires >=1.80,
# sprs 0.11.4 requires >=1.85, criterion 0.8.1 (dev) requires >=1.86. Confirmed by building
# and testing on rustc 1.86.0 directly (both green) and confirming 1.85.0 fails on criterion.
# Previously declared 1.75, which had already drifted false; see CHANGELOG [0.4.0].
rust-version = "1.86"
authors = ["Tyler Zervas <tzervas>"]
license = "MIT"
description = "MCP server for context storage, text-based retrieval, and temporal tracking with optional persistence"
repository = "https://github.com/tzervas/context-mcp"
documentation = "https://docs.rs/context-mcp/latest/context_mcp/"
# "rag" is aspirational (Wave 0+); runtime is text+metadata session memory until eval gates pass (see docs/ROADMAP.md C0).
keywords = ["mcp", "context", "memory", "temporal", "rag"]
categories = ["development-tools", "memory-management"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# MCP and async runtime
tokio = { version = "=1.49.0", features = ["full"] }
async-trait = "=0.1.91"
futures = "=0.3.31"

# Serialization
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# HTTP/WebSocket for MCP
axum = { version = "=0.8.8", features = ["ws"], optional = true }
tower = { version = "=0.5.2", optional = true }
tower-http = { version = "=0.6.8", features = ["cors", "trace"], optional = true }

# Storage backends
# In-memory with LRU
lru = "=0.16.3"
# Disk persistence
sled = { version = "=0.34.7", optional = true }
# Optional: vector similarity (can use embeddenator core)
# embeddenator = { path = "../embeddenator", optional = true }

# Hashing and IDs
sha2 = "=0.10.9"
uuid = { version = "=1.19.0", features = ["v4", "serde"] }
base64 = "=0.22.1"

# Time and temporal reasoning
chrono = { version = "=0.4.42", features = ["serde"] }
humantime = "=2.3.0"

# Logging and tracing
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter", "json"] }

# Error handling
thiserror = "=2.0.18"
anyhow = "=1.0.100"

# CPU optimization
rayon = "=1.11.0"

# CLI
clap = { version = "=4.5.54", features = ["derive"] }

# Random
rand = "=0.9.3"

# Embeddings and quantization
# Dense embeddings for baseline comparison
ndarray = "=0.17.2"

# Optional OpenAI-compatible HTTP embedder (Wave 1 C1.3; feature http-embedder)
reqwest = { version = "=0.12.28", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
] }

# GPU acceleration (optional)
wgpu = { version = "=30.0.0", optional = true }
bytemuck = { version = "=1.24.0", optional = true }

# Sparse vector support
sprs = "=0.11.4"

[dev-dependencies]
tokio-test = "=0.4.5"
tempfile = "=3.24.0"
criterion = { version = "=0.8.1", features = ["async_tokio"] }

# cargo-audit / cargo-deny are CLI tools (cargo install …), NOT package
# dependencies. Listing them under [dev-dependencies] forced clippy
# --all-targets to compile the full gix tree and OOM 8G no-swap runners
# even when scripts/check.sh --quick skipped running `cargo audit`.
# Also: cargo-audit's tree (rustsec/gix/kstring) can raise effective MSRV
# above this crate's verified floor (see `rust-version`). Do not re-add.

[features]
default = ["server", "persistence", "ternary-embeddings"]
server = ["dep:axum", "dep:tower", "dep:tower-http"]
persistence = ["dep:sled"]
simd = []
# Legacy feature flag (always available; Embedder trait is core, not gated)
embeddings = []
# OpenAI-compatible HTTP embedder backend (optional network dep)
http-embedder = ["dep:reqwest"]
# Ternary embeddings with various quantization options
ternary-embeddings = []
# Codebook-free sparsity approach (direct ternary quantization with top-k)
ternary-sparse = ["ternary-embeddings"]
# Small RVQ codebook approach (residual quantization with small codebooks)
ternary-rvq = ["ternary-embeddings"]
# Optional GPU acceleration with wgpu
gpu-acceleration = ["dep:wgpu", "dep:bytemuck", "ternary-embeddings"]
# Combined: all embedding methods (does not enable HTTP)
all-embeddings = ["ternary-sparse", "ternary-rvq", "gpu-acceleration"]

[[bin]]
name = "context-mcp"
path = "src/main.rs"
required-features = ["server"]

[[bench]]
name = "storage_benchmark"
harness = false

[[bench]]
name = "rag_benchmark"
harness = false
