# Commitizen configuration (commitizen-tools).
# Install (optional): pip install commitizen  OR  uv tool install commitizen
# This file is valid without the CLI: agents and humans follow CONTRIBUTING.md § Versioning
# and releases for the same rules. Canonical peer reference: tzervas/gha-runner-ctl/.cz.toml

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.4.0"
tag_format = "v$version"
version_scheme = "semver"
major_version_zero = true

# Keep these files lockstep on every release bump (see CONTRIBUTING.md § Version files).
# Cargo.lock is deliberately NOT listed: cz does a line-oriented replacement and the lock
# file records this package's version on the line AFTER its `name =` key, so a pattern here
# would rewrite the wrong entry. Run `cargo build` (or `cargo update -p context-mcp`) after
# a bump to refresh it.
# Anchored `^version` on purpose. A bare `version` pattern matches EVERY line containing that
# substring — measured: 17 lines in this Cargo.toml, i.e. every dependency `version = "..."`
# key. Only one of them is the package version today, so nothing breaks yet; but a dependency
# pinned at the same version as this package would be silently rewritten by `cz bump`.
# Anchoring restricts the match to the [package] version line. If a `[dependencies.x]` TABLE
# section is ever added, its `version` also sits at line start and the hazard returns.
version_files = ["Cargo.toml:^version"]

update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true